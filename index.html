<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff0f5">
  <title>Happy Birthday, Sudipa!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="birthday-card">
    <div class="sparkle sparkle-one" aria-hidden="true">✦</div>
    <div class="sparkle sparkle-two" aria-hidden="true">✧</div>

    <p class="eyebrow">A little celebration for someone special</p>
    <h1>Happy Birthday,<br><span>Sudipa!</span></h1>
    <p class="intro">Make a wish as your birthday candle glows!</p>

    <section class="countdown-area" aria-live="polite">
      <p class="countdown-label" id="countdown-label">Your candle surprise begins in</p>
      <div class="countdown" id="countdown">3</div>
    </section>

    <section class="cake-area" id="cake-area" aria-label="Birthday cake and candle">
      <div class="flame" id="flame" aria-hidden="true"></div>
      <div class="wick" aria-hidden="true"></div>
      <div class="candle" aria-label="Pink birthday candle"></div>
      <div class="cake">
        <div class="icing"></div>
        <div class="cake-decoration"></div>
      </div>
      <div class="plate"></div>
    </section>

    <p class="wish-message" id="wish-message" aria-live="polite">
      Close your eyes and make a wish 💖
    </p>
    <p class="footer-note">Wishing you a day as lovely as you are ✨</p>
  </main>

  <div class="confetti" id="confetti" aria-hidden="true"></div>
  <script src="script.js"></script>
</body>
</html>
